services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sso
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Example Inc"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
    ports:
      - "389:389"
  api:
    build: .
    depends_on:
      - postgres
    environment:
      SSO_HTTP_ADDR: :8080
      SSO_DB_URL: postgres://sso:sso@postgres:5432/sso?sslmode=disable
      SSO_JWT_SECRET: change-me-change-me-change-me
      SSO_ISSUER: http://localhost:8080
      SSO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8080:8080"
volumes:
  pgdata:

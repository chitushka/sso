services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sso
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso"]
      interval: 5s
      timeout: 3s
      retries: 10

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        VERSION: ${SSO_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SSO_ENV: local
      SSO_HTTP_ADDR: :8080
      SSO_DATABASE_URL: postgres://sso:sso@postgres:5432/sso?sslmode=disable
      # Provide real secrets via a .env file or the shell; the defaults are for local dev only.
      SSO_JWT_SECRET: ${SSO_JWT_SECRET:-change-me-please-change-me-please-change-me}
      SSO_ENCRYPTION_KEY: ${SSO_ENCRYPTION_KEY:-change-me-please-change-me-please-change-me}
      SSO_ACCESS_TOKEN_TTL: 15m
      SSO_SESSION_TTL: 720h
      SSO_REFRESH_TOKEN_TTL: 720h
      SSO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
      SSO_ISSUER: http://localhost:8080
      SSO_OIDC_KEY_ROTATION_ENABLED: "false"
      SSO_LOG_LEVEL: info
      # Apply DB migrations automatically on start (convenient for compose; keep false in prod deploys with a separate migration step).
      SSO_MIGRATE_ON_START: "true"
      # Comma-separated CIDRs of reverse proxies allowed to set X-Forwarded-For.
      SSO_TRUSTED_PROXIES: ${SSO_TRUSTED_PROXIES:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
